{% extends "base.html" %}
{% block title %}房客登入{% endblock %}
{% block content %}
<h1>房客登入</h1>
<p class="muted">請輸入房東提供的四位數密碼。登入後這台手機會記住你，下次會直接進入。</p>
<div class="panel">
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="code">四位數密碼</label>
  <input id="code" name="code" class="code-input" type="password" inputmode="numeric"
         pattern="\d{4}" maxlength="4" autocomplete="one-time-code" required autofocus>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <button class="btn primary block">進入</button>
</form>
</div>
<p class="muted small" style="margin-top:12px">忘記密碼或輸入錯誤太多次，請聯絡房東。</p>
{% endblock %}
