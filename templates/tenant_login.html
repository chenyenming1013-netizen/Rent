{% extends "base.html" %}
{% from "_art.html" import mini_hero %}
{% block title %}房客登入｜租屋小幫手{% endblock %}
{% block content %}
{{ mini_hero('租屋小幫手', '房客登入') }}
<div class="panel" style="margin-top:0">
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="code">請輸入房東提供的四位數密碼</label>
  <input id="code" name="code" class="code-input" type="password" inputmode="numeric"
         pattern="\d{4}" maxlength="4" autocomplete="one-time-code" required autofocus>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <button class="btn primary block">進入我的房間</button>
</form>
</div>
<p class="muted small" style="margin-top:12px">登入後這支手機會記住你，下次會直接進入。忘記密碼請聯絡房東。</p>
{% endblock %}
