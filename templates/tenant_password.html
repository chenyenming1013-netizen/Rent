{% extends "base.html" %}
{% block title %}修改密碼{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('tenant_home') }}">← 我的房間</a>
<h1>修改密碼</h1>
<p class="muted">{{ room.name }}</p>
<div class="panel">
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="old_code">目前的密碼</label>
  <input id="old_code" name="old_code" class="code-input" type="password" inputmode="numeric"
         maxlength="4" autocomplete="current-password" required autofocus>
  <label for="ncode">新密碼（四位數字）</label>
  <input id="ncode" name="code" class="code-input" type="password" inputmode="numeric"
         maxlength="4" autocomplete="new-password" required>
  <label for="ncode2">再輸入一次新密碼</label>
  <input id="ncode2" name="code2" class="code-input" type="password" inputmode="numeric"
         maxlength="4" autocomplete="new-password" required>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <button class="btn primary block">變更密碼</button>
</form>
</div>
<p class="muted small" style="margin-top:12px">改完後房東看不到你的新密碼，忘記時請房東重設。請勿使用提款卡密碼、1234 這類好猜的數字。</p>
{% endblock %}
