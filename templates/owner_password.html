{% extends "base.html" %}
{% block title %}修改屋主密碼{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('owner_home') }}">← 總覽</a>
<h1>修改屋主密碼</h1>
<div class="panel">
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="old">目前的密碼</label>
  <input id="old" name="old" type="password" autocomplete="current-password" required autofocus>
  <label for="new">新密碼（至少 10 個字元，英文加數字）</label>
  <input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required>
  <label for="new2">再輸入一次</label>
  <input id="new2" name="new2" type="password" autocomplete="new-password" minlength="10" required>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <button class="btn primary block">變更密碼</button>
</form>
</div>
<p class="muted small" style="margin-top:12px">變更後，WSGI 檔裡的舊密碼就不能再登入。忘記密碼時，請在 PythonAnywhere 的 Bash 執行重設指令。</p>
{% endblock %}
